<style>

  /* Cells: a narrow gutter for run buttons and execution counts, then the content */

  /* Code and output */

  .editor {

  @media (max-width: 640px) {
    .top, .toolbar-inner, main { padding-left: 1.25rem; padding-right: 1.25rem; }

    .cell { grid-template-columns: minmax(0, 1fr); }

<!-- Code for the background worker that runs Python. -->
<script id="worker-source" type="text/plain">
let pyodide = null;
let currentId = null;

// Pyodide has no network sockets, so urllib.request.urlopen does not work out of the box.
// This replacement fetches the URL with a (synchronous) browser request instead. It is
// enough for downloading a text corpus; the server must allow cross-origin requests.
const URLLIB_SHIM = `
import io
import urllib.request
from pyodide.http import open_url

def _browser_urlopen(url, *args, **kwargs):
    url = getattr(url, "full_url", url)
    return io.BytesIO(open_url(url).read().encode("utf-8"))

urllib.request.urlopen = _browser_urlopen
`;

function cleanTraceback(message) {
  // Drop the frames that belong to Pyodide itself and keep those of the user's code.
  const lines = message.split("\n");
  const first = lines.findIndex((line) => line.includes('File "<exec>"'));
  return first > 0 ? ["Traceback (most recent call last):", ...lines.slice(first)].join("\n") : message;
}

function send(name, text) {
  self.postMessage({ type: "stream", id: currentId, name, text: text + "\n" });
}

self.onmessage = async (event) => {
  const message = event.data;

  if (message.type === "init") {
    try {
      importScripts(message.indexURL + "pyodide.js");
      pyodide = await loadPyodide({ indexURL: message.indexURL });
      pyodide.setStdout({ batched: (text) => send("stdout", text) });
      pyodide.setStderr({ batched: (text) => send("stderr", text) });
      pyodide.runPython(URLLIB_SHIM);
      self.postMessage({ type: "ready", version: pyodide.version });
    } catch (err) {
      self.postMessage({ type: "fatal", message: String((err && err.message) || err) });
    }
    return;
  }

  if (message.type === "run") {
    currentId = message.id;
    let reply = { type: "done", id: message.id };
    try {
      const result = await pyodide.runPythonAsync(message.code);
      if (result !== undefined) {
        // Like Jupyter, show the value of a final expression.
        const builtins = pyodide.pyimport("builtins");
        reply.repr = builtins.repr(result);
        builtins.destroy();
        if (result && typeof result.destroy === "function") result.destroy();
      }
    } catch (err) {
      reply.error = cleanTraceback(String((err && err.message) || err));
    }
    try { pyodide.runPython("import sys; sys.stdout.flush(); sys.stderr.flush()"); } catch (err) {}
    self.postMessage(reply);
  }
};
</script>

<script>
// ---------------------------------------------------------------------------
// Configuration
const NOTEBOOK_URL = "bpe_unigram_tutorial.ipynb";
const PYODIDE_URL = "https://cdn.jsdelivr.net/npm/pyodide@0.29.5/";

// ---------------------------------------------------------------------------
const notebookEl = document.getElementById("notebook");
const statusEl = document.getElementById("status");
const runAllButton = document.getElementById("run-all");
const restartButton = document.getElementById("restart");

const codeCells = [];   // { el, output, countEl, getCode, focus, state, previousCount }
let worker = null;
let pythonReady = false;
let queue = [];
let current = null;     // { cell, id, start }
let executionCount = 0;
let nextId = 0;
let clock = null;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function joinSource(source) {
  return Array.isArray(source) ? source.join("") : source || "";
}

// ---------------------------------------------------------------------------
// Rendering the notebook

function renderMarkdown(source) {
  // Take formulas out before running the Markdown parser, so that e.g. underscores
  // in $t_1$ are not read as emphasis; then typeset them with KaTeX.
  const formulas = [];
  const protectedSource = source.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, (match, display, inline) => {
    formulas.push({ tex: display !== undefined ? display : inline, display: display !== undefined });
    return "MATHPLACEHOLDER" + (formulas.length - 1) + "END";
  });
  const html = window.marked ? marked.parse(protectedSource) : "<pre>" + escapeHtml(protectedSource) + "</pre>";
  return html.replace(/MATHPLACEHOLDER(\d+)END/g, (match, i) => {
    const { tex, display } = formulas[Number(i)];
    if (window.katex) return katex.renderToString(tex, { displayMode: display, throwOnError: false });
    return escapeHtml(display ? "$$" + tex + "$$" : "$" + tex + "$");
  });
}

function appendText(outputEl, text, className) {
  // Append output text, highlighting the word-boundary marker ▁.
  const container = className ? document.createElement("span") : outputEl;
  if (className) {
    container.className = className;
    outputEl.appendChild(container);
  }
  text.split("▁").forEach((part, i) => {
    if (i > 0) {
      const marker = document.createElement("span");
      marker.className = "ws";
      marker.textContent = "▁";
      container.appendChild(marker);
    }
    if (part) container.appendChild(document.createTextNode(part));
  });
}

function makeGutter(withButton) {
  const gutter = document.createElement("div");
  gutter.className = "gutter";
  if (!withButton) return { gutter };
  const button = document.createElement("button");
  button.className = "run-cell";
  button.setAttribute("aria-label", "Run cell");
  button.title = "Run cell (Shift+Enter)";
  button.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5 9.5 5 1 9.5z"/></svg>';
  const countEl = document.createElement("span");
  countEl.className = "count";
  countEl.textContent = "[ ]";
  gutter.append(button, countEl);
  return { gutter, button, countEl };
}

function addMarkdownCell(source) {
  const el = document.createElement("section");
  el.className = "cell markdown-cell";
  const { gutter } = makeGutter(false);
  const body = document.createElement("div");
  body.className = "markdown";
  body.innerHTML = renderMarkdown(source);
  el.append(gutter, body);
  notebookEl.appendChild(el);
  return el;
}

function addCodeCell(source, savedOutputs) {
  const el = document.createElement("section");
  el.className = "cell code-cell";
  el.dataset.state = "idle";
  const { gutter, button, countEl } = makeGutter(true);
  const body = document.createElement("div");
  const editorEl = document.createElement("div");
  editorEl.className = "editor";
  const textarea = document.createElement("textarea");
  textarea.value = source;
  textarea.spellcheck = false;
  textarea.setAttribute("aria-label", "Python code");
  textarea.rows = Math.max(1, source.split("\n").length);
  editorEl.appendChild(textarea);
  const output = document.createElement("pre");
  output.className = "output";
  body.append(editorEl, output);
  el.append(gutter, body);
  notebookEl.appendChild(el);

  const cell = { el, output, countEl, state: "idle", previousCount: "[ ]" };
  const runAndAdvance = () => {
    runCell(cell);
    const next = codeCells[codeCells.indexOf(cell) + 1];
    if (next) next.focus();
  };

  if (window.CodeMirror) {
    const editor = CodeMirror.fromTextArea(textarea, {
      mode: { name: "python", version: 3 },
      indentUnit: 4,
      viewportMargin: Infinity,
      matchBrackets: false,
      extraKeys: {
        "Shift-Enter": runAndAdvance,
        Tab: (cm) => (cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ")),
      },
    });
    cell.getCode = () => editor.getValue();
    cell.focus = () => editor.focus();
  } else {
    textarea.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.shiftKey) {
        event.preventDefault();
        runAndAdvance();
      }
    });
    cell.getCode = () => textarea.value;
    cell.focus = () => textarea.focus();
  }

  // Show the outputs stored in the notebook until the cell is run.
  for (const out of savedOutputs || []) {
    if (out.output_type === "stream") appendText(output, joinSource(out.text));
    if (out.output_type === "execute_result" && out.data && out.data["text/plain"]) {
      appendText(output, joinSource(out.data["text/plain"]) + "\n");
    }
  }
  output.classList.add("saved");

  button.addEventListener("click", () => runCell(cell));
  codeCells.push(cell);
}

async function loadNotebook() {
  let notebook;
  try {
    const response = await fetch(NOTEBOOK_URL);
    if (!response.ok) throw new Error(response.status + " " + response.statusText);
    notebook = await response.json();
  } catch (err) {
    setStatus("Could not load " + NOTEBOOK_URL + " (" + err.message + "). The page must be served over http(s), next to the notebook.", true);
    runAllButton.disabled = true;
    restartButton.disabled = true;
    return false;
  }
  notebook.cells.forEach((nbCell, i) => {
    const source = joinSource(nbCell.source);
    if (nbCell.cell_type === "markdown") {
      addMarkdownCell(source);
    } else if (nbCell.cell_type === "code") {
      addCodeCell(source, nbCell.outputs);
    }
    if (i === 0) {
      const note = addMarkdownCell(
        "This page runs the code in your browser, with Python compiled to WebAssembly (Pyodide). " +
        "That is slower than a local Python installation, so expect the training steps to take a few minutes. " +
        "Cells share their variables: run them from top to bottom, or use *Run all*. " +
        "The outputs shown are from a previous run and are replaced when a cell is run. Code cells can be edited."
      );
      note.querySelector(".markdown").classList.add("note");
    }
  });
  const title = notebookEl.querySelector("h1");
  if (title) document.title = title.textContent;
  return true;
}

// ---------------------------------------------------------------------------
// Running code

function startWorker() {
  const source = document.getElementById("worker-source").textContent;
  worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
  pythonReady = false;
  worker.onmessage = onWorkerMessage;
  worker.onerror = (event) => setStatus("Python could not be started: " + event.message, true);
  worker.postMessage({ type: "init", indexURL: PYODIDE_URL });
  updateStatus();
}

function setCellState(cell, state) {
  cell.state = state;
  cell.el.dataset.state = state;
}

function runCell(cell) {
  if (cell.state === "queued" || cell.state === "running") return;
  cell.previousCount = cell.countEl.textContent;
  cell.countEl.textContent = "[*]";
  setCellState(cell, "queued");
  queue.push(cell);
  processQueue();
}

function processQueue() {
  if (!pythonReady || current || queue.length === 0) {
    updateStatus();
    return;
  }
  const cell = queue.shift();
  current = { cell, id: ++nextId, start: Date.now() };
  cell.output.textContent = "";
  cell.output.classList.remove("saved");
  setCellState(cell, "running");
  worker.postMessage({ type: "run", id: current.id, code: cell.getCode() });
  clearInterval(clock);
  clock = setInterval(updateStatus, 1000);
  updateStatus();
}

function cancelQueue() {
  for (const cell of queue) {
    cell.countEl.textContent = cell.previousCount;
    setCellState(cell, "idle");
  }
  queue = [];
}

function onWorkerMessage(event) {
  const message = event.data;
  if (message.type === "ready") {
    pythonReady = true;
    processQueue();
  } else if (message.type === "fatal") {
    setStatus("Python could not be loaded (" + message.message + "). Check the internet connection and reload the page.", true);
  } else if (message.type === "stream") {
    if (current && message.id === current.id) {
      appendText(current.cell.output, message.text, message.name === "stderr" ? "stderr" : null);
    }
  } else if (message.type === "done") {
    if (!current || message.id !== current.id) return;
    const cell = current.cell;
    current = null;
    clearInterval(clock);
    if (message.error) {
      appendText(cell.output, message.error, "traceback");
      cell.countEl.textContent = "[!]";
      setCellState(cell, "error");
      cancelQueue();  // like Jupyter, stop "Run all" at the first error
    } else {
      if (message.repr !== undefined) appendText(cell.output, message.repr + "\n");
      cell.countEl.textContent = "[" + ++executionCount + "]";
      setCellState(cell, "done");
    }
    processQueue();
  }
}

function updateStatus() {
  if (current) {
    const seconds = Math.floor((Date.now() - current.start) / 1000);
    const elapsed = Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
    const position = codeCells.indexOf(current.cell) + 1;
    const waiting = queue.length ? `, ${queue.length} more queued` : "";
    setStatus(`Running code cell ${position} of ${codeCells.length} (${elapsed})${waiting}`);
  } else if (!pythonReady) {
    setStatus(queue.length ? "Loading Python… (cells will run once it is ready)" : "Loading Python…");
  } else {
    setStatus("Python is ready");
  }
}

function restartPython() {
  if (worker) worker.terminate();
  clearInterval(clock);
  if (current) {
    appendText(current.cell.output, "Stopped: Python was restarted.\n", "stderr");
    current.cell.countEl.textContent = "[ ]";
    setCellState(current.cell, "idle");
    current = null;
  }
  cancelQueue();
  executionCount = 0;
  startWorker();
}

runAllButton.addEventListener("click", () => codeCells.forEach(runCell));
restartButton.addEventListener("click", restartPython);

loadNotebook().then((loaded) => { if (loaded) startWorker(); });
</script>
